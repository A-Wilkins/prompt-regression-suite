name: prompt regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  eval:
    # Calls the Claude API, so it needs the ANTHROPIC_API_KEY repository secret.
    # Pull requests from forks never get the secret, so the job is skipped there.
    needs: unit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run suites against the committed baselines
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set; skipping the live eval."
            exit 0
          fi
          npm run eval
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-regression-report
          path: reports/
          if-no-files-found: ignore
